<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>準備中｜市民活動団体ハッスル</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary:  #C06030;
      --color-accent:   #E8934A;
      --color-bg:       #FFFDF8;
      --color-bg-warm:  #FDF5E8;
      --color-text:     #3A2E1F;
      --color-text-sub: #7A6A55;
      --color-border:   #F0E8D8;
      --font-main:      'Noto Sans JP', sans-serif;
      --font-display:   'Zen Maru Gothic', sans-serif;
      --radius-sm:      8px;
      --radius-md:      12px;
      --radius-lg:      24px;
      --max-width:      860px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body { font-family: var(--font-main); background: var(--color-bg); color: var(--color-text); line-height: 1.8; -webkit-font-smoothing: antialiased; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .site-wrapper { display: flex; flex-direction: column; min-height: 100vh; }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

    /* Header */
    .site-header { background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
    .site-header .container { display: flex; align-items: center; height: 64px; }
    .site-logo { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--color-primary); display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
    .site-logo::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--color-accent); border-radius: 50%; flex-shrink: 0; align-self: center; }
    .site-logo__sub { font-size: 11px; font-weight: 400; color: var(--color-text-sub); }

    /* Coming Soon */
    .coming-soon { flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px 24px; }
    .coming-soon__inner { text-align: center; max-width: 480px; }
    .coming-soon__icon { font-size: 52px; margin-bottom: 20px; line-height: 1; }
    .coming-soon__label { font-size: 11px; font-weight: 500; color: var(--color-accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
    .coming-soon__title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-text); margin-bottom: 16px; }
    .coming-soon__text { font-size: 14px; color: var(--color-text-sub); line-height: 1.9; margin-bottom: 32px; }
    .btn { display: inline-block; font-family: var(--font-main); font-size: 14px; font-weight: 500; padding: 10px 24px; border-radius: var(--radius-lg); transition: opacity 0.2s; text-decoration: none; }
    .btn:hover { opacity: 0.85; text-decoration: none; }
    .btn-outline { background: #fff; color: var(--color-primary); border: 1.5px solid var(--color-accent); }

    /* Footer */
    .site-footer { background: #3A2E1F; padding: 20px 0; }
    .footer-copy { font-size: 10px; color: #7A6A55; text-align: center; }
  </style>
</head>
<body>
<div class="site-wrapper">

  <header class="site-header">
    <div class="container">
      <a class="site-logo" href="/">
        市民活動団体 ハッスル
        <span class="site-logo__sub">東広島市地域</span>
      </a>
    </div>
  </header>

  <main class="coming-soon">
    <div class="coming-soon__inner">
      <div class="coming-soon__icon">🌱</div>
      <p class="coming-soon__label">Coming Soon</p>
      <h1 class="coming-soon__title">準備中です</h1>
      <p class="coming-soon__text">
        このページは現在準備中です。<br>
        もうしばらくお待ちください。
      </p>
      <a href="/" class="btn btn-outline">トップへ戻る</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">&copy; 2022 hassle. All rights reserved.</p>
    </div>
  </footer>

</div>
</body>
</html>
